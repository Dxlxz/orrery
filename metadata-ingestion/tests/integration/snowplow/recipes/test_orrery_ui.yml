# Recipe for testing ownership with local Orrery instance
# This ingests Snowplow data with ownership into Orrery for UI visualization

source:
  type: snowplow
  config:
    bdp_connection:
      organization_id: "test-org-uuid"
      api_key_id: "test-key-id"
      api_key: "test-secret"
      console_api_url: "http://localhost:8081"  # Mock BDP server

    extract_event_specifications: false
    extract_tracking_plans: false

sink:
  type: orrery-rest
  config:
    server: "http://localhost:8080"
    # token will be provided via environment variable
    token: "${ORRERY_TOKEN}"
