---
# see https://docs.orrery.dev/docs/generated/ingestion/sources/kafka for complete documentation
source:
  type: "kafka"
  config:
    connection:
      bootstrap: "localhost:9092"
    topic_patterns:
      allow:
        - ".*"
      deny:
        - "^_.+" # deny all tables that start with an underscore

# see https://docs.orrery.dev/docs/metadata-ingestion/sink_docs/orrery for complete documentation
sink:
  type: "orrery-kafka"
  config:
    connection:
      bootstrap: "localhost:9092"
