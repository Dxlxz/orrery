[tool.uv]
# Lock resolution is 3.11–3.13 (CI, Docker, bundled venvs). Published
# requires-python stays >=3.10; extras that pull unstructured still fail
# closed on 3.10 at pip install. Without this, uv lock --check tries to
# solve those extras (and [dev]/[docs]) on 3.10. Cap below 3.14 to match
# unstructured / onnxruntime wheel availability.
environments = [
    "python_full_version >= '3.11' and python_full_version < '3.14'",
]
# Security constraints applied during resolution (see each comment).
constraint-dependencies = [
    "jaraco-context>=6.1.0,<7",  # GHSA-58pv-8j8x-9vj2 (path traversal)
    "pypdf>=6.19.0,<7.0.0",  # GHSA-4pxv-j86v-mhcw; CVE-2026-103000 / GHSA-w23x-9jrw-r45c (page-label DoS). Cap major until reviewed.
    "authlib>=1.9.0,<2.0.0",  # GHSA-jj8c-mmj3-mmgv (OAuth cache CSRF); CVE-2026-96760 fixed in 1.9.0
    # CVE-2026-102946: fixed in joserfc 1.7.4. Transitive via authlib, whose own floor
    # (joserfc>=1.6.8) still admits vulnerable versions.
    "joserfc>=1.7.4,<2.0.0",
    # CVE-2026-114603: fixed in opentelemetry-api 1.45.1. Transitive via
    # google-cloud-logging / mlflow-skinny.
    "opentelemetry-api>=1.45.1",
    # CVE-2026-45409: DoS via idna.encode() on crafted inputs (bypass of CVE-2024-3651 fix).
    # Not in setup.py: Airflow constraints pin idna to older versions (e.g. 3.4, 3.10).
    # Enforced for Docker via docker/snippets/ingestion/constraints.txt.
    "idna>=3.15,<4.0.0",
    # GHSA-xgmm-8j9v-c9wx: reject JWK JSON as HMAC secret; fixed in PyJWT 2.13.0.
    # Not in setup.py: Airflow constraints pin PyJWT to older versions (e.g. 2.10.1, 2.12.1).
    # Enforced for Docker via docker/snippets/ingestion/constraints.txt.
    "PyJWT>=2.15.0,<3.0.0",
    # urllib3: CVE-2025-66418, CVE-2025-66471, CVE-2026-21441 (fixed 2.6.3), CVE-2026-44431 (2.7.0).
    # setup.py floors urllib3 at >=2.5.0 (Airflow ceiling); >=2.8.0 is enforced here at lock time
    # only, since Airflow constraints pin urllib3 below 2.7.
    "urllib3>=2.8.0,<3.0.0",
    # CVE-2026-59890 (fixed in 83.0.0) and GHSA-xmj3-9gf7-h52w (Windows path escape via
    # namespace_packages.txt in legacy wheel installs, fixed in 84.1.0): floored at lock
    # time, not in base_requirements (Airflow constraint files pin setuptools, so a base
    # floor breaks those installs).
    "setuptools>=84.1.0",
    # pip: CVE-2026-3219, CVE-2026-6357 (fixed in 26.1); CVE-2026-8643 (path traversal
    # via entry point names, fixed in 26.1.2); CVE-2026-13346 (URL path decoded twice
    # when determining a link filename, fixed in 26.2). setup.py declares a bare "pip"
    # (no upper bound: pip is a system tool), so the floor is enforced here at lock time
    # and mirrored in docker/snippets/ingestion/constraints.txt. The resolved pin ships
    # as orrery/constraints.txt and constrains every executor-built venv.
    "pip>=26.2.2",  # 26.2.1 vendors certifi 2026.6.17 (GHSA-6q48-6c7w-9gw2); 26.2.2 fixes
    # anyio: CVE-2026-64847 (process-pool workers block on undrained stderr);
    # fixed in 4.14.2. setup.py floors at >=4.10.0 (Airflow 3.0 pin); >=4.14.2
    # is enforced here at lock time only.
    "anyio>=4.14.2,<5.0.0",
    # click: CVE-2026-7246 (8.1.7 / 8.3.1; fixed in 8.3.3). setup.py stays
    # Airflow-satisfiable (3.0/3.1 pin 8.2.1, 3.2 pins 8.3.1); >=8.3.3 is
    # enforced here at lock time only.
    "click>=8.3.3,<9.0.0",
    # soupsieve: CVE-2026-85999, CVE-2026-86000 (ReDoS); also CVE-2026-49476/49477
    # (fixed 2.8.4). Transitive via beautifulsoup4; not in setup.py. Docker
    # snippet: docker/snippets/ingestion/constraints.txt.
    "soupsieve>=2.9.0",
    # aiohttp: CVE-2026-111064 / GHSA-2g87-pp6c-29x5; fixed in 3.14.4. setup.py stays
    # Airflow-satisfiable (aiohttp<4, no floor); enforced here at lock time and in
    # docker/snippets/ingestion/constraints.txt.
    "aiohttp>=3.14.4,<4",
    # multidict: CVE-2026-104874; fixed in 6.9.1. Transitive via aiohttp/yarl; not in
    # setup.py. Docker snippet: docker/snippets/ingestion/constraints.txt.
    "multidict>=6.9.1",
    # Mako: CVE-2026-102991; fixed in 1.4.2. Transitive via alembic; not in setup.py.
    # Docker snippet: docker/snippets/ingestion/constraints.txt.
    "mako>=1.4.2,<2",
    # fsspec: CVE-2026-104851; fixed in 2026.6.0. Transitive via s3fs/adlfs/pyiceberg/
    # dask; not in setup.py. s3fs pins fsspec to its own version, so this also moves
    # s3fs/adlfs. Docker snippet: docker/snippets/ingestion/constraints.txt.
    "fsspec>=2026.6.0",
    # pyasn1: CVE-2026-119194, CVE-2026-119195, CVE-2026-119196, CVE-2026-119197;
    # fixed in 0.6.5. Transitive via rsa / pyasn1-modules (google-auth, ldap); not in
    # setup.py. Docker snippet: docker/snippets/ingestion/constraints.txt.
    "pyasn1>=0.6.5,<0.7.0",
    # numpy 1.x ships no 3.13 wheels and does not build there. setup.py only caps
    # numpy<2 below 3.13, but without this uv still reuses the <3.13 fork's 1.26.4
    # for 3.13 (numpy comes in through extras such as file_profiling and feast).
    "numpy>=2.1; python_full_version >= '3.13'",
]

[tool.ruff]
target-version = "py310"
# Same as Black.
line-length = 88
# Exclude directories matching these patterns.
exclude = [
    ".git",
    "src/orrery/metadata",
    "build",
    "dist",
    "venv",
    ".tox",
    "__pycache__",
]

[tool.ruff.lint]
extend-select = [
    "B",    # flake8-bugbear
    "C90",  # mccabe complexity
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "G010", # logging.warn -> logging.warning
    "I",    # isort
    "TID",  # flake8-tidy-imports
    "RUF100",  # unused-noqa
    "SIM",   # flake8-simplify
]
extend-ignore = [
    "E501",  # Handled by formatter
    "E111",  # Handled by formatter
    "E114",  # Handled by formatter
    "E117",  # Handled by formatter
    "B019",  # Allow usages of functools.lru_cache
    "B008",  # Allow function call in argument defaults
    "RUF012", # mutable-class-default; incompatible with pydantic
    "RUF015", # unnecessary-iterable-allocation-for-first-element

    # Can be enabled later if someone wants to fix existing cases or an auto-fix becomes available
    "SIM102", # Use a single `if` statement instead of nested `if` statements
    "SIM103", # Return the condition directly
    "SIM105", # Use `contextlib.suppress(...)` instead of `try`-`except`-`pass`
    "SIM115", # Use a context manager for opening files
    "SIM116", # Use a dictionary instead of consecutive `if` statements
    "SIM117", # Use a single `with` statement instead of nested `with` statements
]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# pydantic v2 deprecations
"pydantic.validator" = { msg = "Use pydantic.field_validator instead of deprecated validator" }
"pydantic.root_validator" = { msg = "Use pydantic.model_validator instead of deprecated root_validator" }
# freezegun does not support pydantic v2: https://github.com/spulec/freezegun/issues/480
"freezegun" = { msg = "Use time-machine instead: @time_machine.travel(TIME, tick=False). See https://github.com/spulec/freezegun/issues/480" }
"freezegun.api" = { msg = "Use time-machine instead: @time_machine.travel(TIME, tick=False). See https://github.com/spulec/freezegun/issues/480" }

[tool.ruff.lint.isort]
section-order = ["future", "patch", "standard-library", "third-party", "first-party", "local-folder"]
sections = { "patch" = ["orrery.utilities._markupsafe_compat", "orrery.sql_parsing._sqlglot_patch"] }
known-first-party = ["orrery"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"src/orrery/configuration/pydantic_migration_helpers.py" = ["TID251"]  # Intentional V1 imports for backward compatibility
