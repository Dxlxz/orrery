pipeline_name: orrery_source_1
orrery_api:
  server: "http://localhost:8080" # Migrate data from Orrery instance on localhost:8080
  token: "<token>"
source:
  type: orrery
  config:
    include_all_versions: false
    database_connection:
      scheme: "mysql+pymysql" # or "postgresql+psycopg2" for Postgres
      host_port: "<database_host>:<database_port>"
      username: "<username>"
      password: "<password>"
      database: "<database>"
    kafka_connection:
      bootstrap: "<boostrap_url>:9092"
      schema_registry_url: "<schema_registry_url>:8081"
    stateful_ingestion:
      enabled: true
      ignore_old_state: false
    urn_pattern:
      deny:
        # Ignores all orrery metadata where the urn matches the regex
        - ^denied.urn.*
      allow:
        # Ingests all orrery metadata where the urn matches the regex.
        - ^allowed.urn.*

flags:
  set_system_metadata: false # Replicate system metadata

# Here, we write to a Orrery instance
# You can also use a different sink, e.g. to write the data to a file instead
sink:
  type: orrery-rest
  config:
    server: "<destination_gms_url>"
    token: "<token>"
