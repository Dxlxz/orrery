lint-job:
  - modified: ".github/workflows/lint-jobs.yml"
  - ".github/path-filters/lint-jobs-filters.yml"
markdown:
  - added|modified: "**/*.md"
  - ".github/scripts/check_docusaurus_markdown.py"
  - "orrery-web-react/build.gradle"
github-actions:
  - added|modified: ".github/**/*.yml"
  - added|modified: ".github/**/*.yaml"
workflow-files:
  - added|modified: ".github/workflows/**"
runner-labels:
  - added|modified: ".github/workflows/**"
  - added|modified: ".github/actions/**"
workflow-validation:
  - ".github/workflows/**"
  - ".github/scripts/validate_post_workflow_list.py"
code-check-sources:
  - "metadata-io/**"
  - "orrery-web-react/**"
  - "metadata-service/war/src/main/resources/boot/policies.json"
  - "**/build.gradle"
  - "**/build.gradle.kts"
  - "**/gradle.lockfile"
  - ".github/scripts/check_*.py"
pdl:
  - added|modified: "**/*.pdl"
  - ".github/scripts/bump_schema_versions.py"
smoke-test-python:
  - added|modified: "smoke-test/**/*.py"
  - "smoke-test/pyproject.toml"
  - "smoke-test/requirements.txt"
  - "smoke-test/build.gradle"
vitals-node:
  - added|modified: "e2e-test/perf/vitals/**"
orrery-web-react:
  - added|modified: "orrery-web-react/**"
  # yarnGenerate declares these as inputs (see orrery-web-react/build.gradle):
  # codegen validates the frontend's own query documents against the server
  # schema, so a schema change alone can break the frontend build. Without this
  # the check ran nowhere on a schema-only PR.
  - "orrery-graphql-core/src/main/resources/**/*.graphql"
metadata-ingestion:
  - added|modified: "metadata-ingestion/**"
  - "metadata-models/**"
orrery-actions:
  - added|modified: "orrery-actions/**"
orrery-agent-context:
  - added|modified: "orrery-agent-context/**"
airflow-plugin:
  - added|modified: "metadata-ingestion-modules/airflow-plugin/**"
gx-plugin:
  - added|modified: "metadata-ingestion-modules/gx-plugin/**"
dagster-plugin:
  - added|modified: "metadata-ingestion-modules/dagster-plugin/**"
prefect-plugin:
  - added|modified: "metadata-ingestion-modules/prefect-plugin/**"
playwright-e2e:
  - added|modified: "e2e-test/ui/playwright/**"
  - added|modified: ".github/scripts/check_playwright_p0.py"
docs-website:
  - added|modified: "docs-website/generateDocsDir.ts"
  - added|modified: "docs-website/sidebars.js"
  - added|modified: "docs-website/src/pages/index.js"
  - "docs-website/package.json"
  - "docs-website/yarn.lock"
  - "docs-website/build.gradle"
spotless:
  - added|modified: "**/*.java"
  - "**/*.gradle"
  - "**/*.gradle.kts"
product-update-sync:
  - docs/how/breaking-changes.md
  - docs/managed-orrery/release-notes/**
  - metadata-service/configuration/src/main/resources/product-update.json
  - metadata-service/configuration/src/main/resources/product-update-saas.json
  - metadata-service/configuration/src/productUpdateCiGate/**
  - metadata-service/configuration/build.gradle
  # ProductUpdateReleaseSyncTest requires every UI locale under this tree to have
  # toast copy. Frontend-only locale PRs skipped the lint job without this glob.
  - orrery-web-react/src/i18n/locales/**
