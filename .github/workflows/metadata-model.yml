name: metadata model generate
on:
  push:
    branches:
      - master
    paths:
      - "metadata-models/**"
      - "metadata-ingestion/scripts/modeldocgen.py"
      - "metadata-ingestion/scripts/modeldocupload.sh"
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.publish.outputs.publish }}
      orrery_configured: ${{ steps.publish.outputs.orrery_configured }}
    steps:
      - name: Check whether upload to orrery is enabled
        id: publish
        # secrets cannot be referenced directly in step `if:` conditions, so we
        # resolve the Orrery target here and expose a boolean output instead.
        env:
          ORRERY_SERVER: ${{ secrets.OrreryServer }}
        run: |
          echo "Enable publish: ${{ github.repository == 'Dxlxz/orrery' }}"
          echo "publish=${{ github.repository == 'Dxlxz/orrery' }}" >> "$GITHUB_OUTPUT"
          if [ -n "$ORRERY_SERVER" ]; then
            echo "orrery_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "orrery_configured=false" >> "$GITHUB_OUTPUT"
          fi
  metadata-ingestion-docgen:
    runs-on: ubuntu-24.04
    needs: setup
    steps:
      - uses: acryldata/sane-checkout-action@186e92cc5948a9c3e1cc7a96eaff9f776f3fc8e3 # v7
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
      - name: Configure fast APT mirror
        if: ${{ vars.CI_USE_FAST_API_MIRROR == 'true' }}
        uses: ./.github/actions/configure-fast-apt-mirror
      - name: Install dependencies
        run: ./metadata-ingestion/scripts/install_deps.sh
      - name: Run model generation
        run: ./gradlew :metadata-models:build
      - name: Generate metadata files
        if: ${{ needs.setup.outputs.publish == 'true' }}
        run: ./gradlew :metadata-ingestion:modelDocGen
      - name: Configure AWS Credentials
        if: ${{ needs.setup.outputs.publish == 'true' }}
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          aws-access-key-id: ${{ secrets.ACRYL_CI_ARTIFACTS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ACRYL_CI_ARTIFACTS_ACCESS_KEY }}
          aws-region: us-west-2
      - name: Upload metadata to S3
        if: ${{ needs.setup.outputs.publish == 'true' }}
        run: aws s3 cp ./metadata-ingestion/generated/docs/metadata_model_mces.json s3://${{ secrets.ACRYL_CI_ARTIFACTS_BUCKET }}/orrery/demo/metadata/
      - name: Warn if Orrery upload target is not configured
        if: ${{ needs.setup.outputs.publish == 'true' && needs.setup.outputs.orrery_configured != 'true' }}
        run: echo "::warning::Skipping 'Upload metadata to Orrery' because the OrreryServer secret is not set. The model was still generated and uploaded to S3."
      - name: Upload metadata to Orrery
        if: ${{ needs.setup.outputs.publish == 'true' && needs.setup.outputs.orrery_configured == 'true' }}
        env:
          ORRERY_SERVER: ${{ secrets.OrreryServer }}
          ORRERY_TOKEN: ${{ secrets.OrreryToken }}
          ORRERY_TELEMETRY_ENABLED: false
        run: ./gradlew :metadata-ingestion:modelDocUpload
