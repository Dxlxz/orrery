name: Orrery Agent Context
on:
  push:
    branches:
      - master
      - releases/**
      - hotfixes/**
    paths:
      - ".github/workflows/agent-context.yml"
      - "orrery-agent-context**"
      - "metadata-ingestion/**"
      - "metadata-models/**"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/agent-context.yml"
      - "orrery-agent-context**"
      - "metadata-ingestion/**"
      - "metadata-models/**"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build-orrery-agent-context:
    # Depot for internal runs (remote Gradle build cache via DEPOT_CACHE_TOKEN);
    # fork PRs stay GitHub-hosted. Non-PR events have no pull_request, so the
    # fork check is false there.
    runs-on: ${{ vars.DEPOT_PROJECT_ID != '' && !github.event.pull_request.head.repo.fork && 'depot-ubuntu-24.04' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
      - name: Test packages are correct
        run: |
          cd orrery-agent-context;
          python -c 'import setuptools; where="./src"; assert setuptools.find_packages(where) == setuptools.find_namespace_packages(where), "you seem to be missing or have extra __init__.py files"'
      - name: Gradle build (and test)
        run: |
          ./gradlew :orrery-agent-context:build

      - name: Report test results
        if: (!cancelled())
        uses: ./.github/actions/report-test-results
        with:
          artifact-name: orrery-agent-context-test-results
          test-results-paths: "orrery-agent-context/test-results/**"
          junit-file-globs: "orrery-agent-context/test-results/*.xml"
      - name: Upload orrery-agent-context coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: ./build/coverage-reports/orrery-agent-context/
          #handle_no_reports_found: true
          fail_ci_if_error: false
          name: orrery-agent-context
          verbose: true
          override_branch: ${{ github.head_ref || github.ref_name }}

  event-file:
    runs-on: ubuntu-24.04
    steps:
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Event File
          path: ${{ github.event_path }}
