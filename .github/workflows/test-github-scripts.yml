name: Python Tests for github scripts

on:
  push:
    paths:
      - ".github/scripts/**"
    branches:
      - master
      - releases/**
      - hotfixes/**
  pull_request:
    paths:
      - ".github/scripts/**"
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: ./.github/actions/setup-toolchain
        with:
          java: false
          gradle: false

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Deps pulled in by the scripts under test: requests/posthog match
          # post-workflow-actions.yml; defusedxml is used by the XML parsers;
          # pyyaml is imported by pre-commit/generate_pre_commit.py.
          pip install pytest requests==2.32.5 posthog==7.9.4 defusedxml pyyaml

      - name: Run tests
        run: |
          pytest .github/scripts/test .github/scripts/release/test .github/scripts/pre-commit/tests
