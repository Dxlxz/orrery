entities:
- name: dataPlatform
  category: core
  keyAspect: dataPlatformKey
  aspects:
    - dataPlatformInfo
- name: dataset
  doc: Datasets represent logical or physical data assets stored or represented in various data platforms. Tables, Views, Streams are all instances of datasets.
  category: core
  keyAspect: datasetKey
  aspects:
    - viewProperties
    - subTypes
    - datasetProfile
    - datasetUsageStatistics
    - operation
    - domains
    - status
    - container
    - deprecation
    - testResults
    - siblings
    - embed
    - ownership
    - glossaryTerms
    - globalTags
- name: orreryPolicy
  doc: Orrery Policies represent access policies granted to users or groups on metadata operations like edit, view etc.
  category: internal
  keyAspect: orreryPolicyKey
  aspects:
    - orreryPolicyInfo
- name: dataJob
  keyAspect: dataJobKey
  aspects:
    - orreryIngestionRunSummary
    - orreryIngestionCheckpoint
    - domains
    - deprecation
    - versionInfo
- name: dataFlow
  category: core
  keyAspect: dataFlowKey
  aspects:
    - domains
    - deprecation
    - versionInfo
- name: dataProcessInstance
  doc: DataProcessInstance represents an instance of a datajob/jobflow run
  keyAspect: dataProcessInstanceKey
  aspects:
    - dataProcessInstanceInput
    - dataProcessInstanceOutput
    - dataProcessInstanceProperties
    - dataProcessInstanceRelationships
    - dataProcessInstanceRunEvent
- name: chart
  keyAspect: chartKey
  aspects:
    - domains
    - container
    - deprecation
    - chartUsageStatistics
    - embed
- name: dashboard
  keyAspect: dashboardKey
  aspects:
    - domains
    - container
    - deprecation
    - dashboardUsageStatistics
    - subTypes
    - embed
- name: notebook
  doc: Notebook represents a combination of query, text, chart and etc. This is in BETA version
  keyAspect: notebookKey
  aspects:
    - notebookInfo
    - notebookContent
    - editableNotebookProperties
    - ownership
    - status
    - globalTags
    - glossaryTerms
    - browsePaths
    - institutionalMemory
    - domains
    - subTypes
    - dataPlatformInstance
- name: corpuser
  doc: CorpUser represents an identity of a person (or an account) in the enterprise.
  keyAspect: corpUserKey
  aspects:
    - corpUserInfo
    - corpUserEditableInfo
    - corpUserStatus
    - groupMembership
    - globalTags
    - status
    - corpUserCredentials
    - nativeGroupMembership
    - corpUserSettings
    - origin
    - roleMembership
- name: corpGroup
  doc: CorpGroup represents an identity of a group of users in the enterprise.
  keyAspect: corpGroupKey
  aspects:
    - corpGroupInfo
    - corpGroupEditableInfo
    - globalTags
    - ownership
    - status
    - origin
- name: domain
  doc: A data domain within an organization.
  keyAspect: domainKey
  aspects:
    - domainProperties
    - institutionalMemory
    - ownership
- name: container
  doc: A container of related data assets.
  keyAspect: containerKey
  aspects:
    - containerProperties
    - editableContainerProperties
    - dataPlatformInstance
    - subTypes
    - ownership
    - container
    - globalTags
    - glossaryTerms
    - institutionalMemory
    - browsePaths # unclear if this will be used
    - status
    - domains
- name: tag
  keyAspect: tagKey
  aspects:
    - tagProperties
    - ownership
    - deprecation
- name: glossaryTerm
  keyAspect: glossaryTermKey
  aspects:
    - glossaryTermInfo
    - institutionalMemory
    - ownership
    - deprecation
    - domains
- name: glossaryNode
