events:
plugins:
  aspectPayloadValidators:
    - className: 'com.linkedin.metadata.aspect.plugins.validation.AspectPayloadValidator'
      enabled: true
      spring:
        enabled: true
      packageScan:
        - com.linkedin.gms.factory.plugins
  mcpSideEffects:
    - className: 'com.linkedin.metadata.aspect.plugins.hooks.MCPSideEffect'
      enabled: true
      spring:
        enabled: true
      packageScan:
        - com.linkedin.gms.factory.plugins
  mcpObservers:
    - className: 'com.linkedin.metadata.aspect.plugins.hooks.MCPObserver'
      enabled: true
      spring:
        enabled: true
      packageScan:
        - com.linkedin.gms.factory.plugins
  mutationHooks:
    - className: 'com.linkedin.metadata.aspect.plugins.hooks.MutationHook'
      enabled: true
      spring:
        enabled: true
      packageScan:
        - com.linkedin.gms.factory.plugins
