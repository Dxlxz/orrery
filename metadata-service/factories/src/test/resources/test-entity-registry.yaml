id: test-registry
entities:
  - name: corpuser
    keyAspect: corpUserKey
    aspects:
      - corpUserInfo
  - name: chart
    keyAspect: chartKey
    aspects:
      - domains
      - dataPlatformInstance
  - name: dataPlatform
    category: core
    keyAspect: dataPlatformKey
    aspects:
      - dataPlatformInfo
  - name: entityType
    doc: A type of entity in the Orrery Metadata Model.
    category: core
    keyAspect: entityTypeKey
    aspects:
      - entityTypeInfo
      - institutionalMemory
      - status
  - name: dataType
    doc: A type of data element stored within Orrery.
    category: core
    keyAspect: dataTypeKey
    aspects:
      - dataTypeInfo
      - institutionalMemory
      - status
  - name: orreryPageModule
    doc: A module within a Orrery page.
    category: core
    keyAspect: orreryPageModuleKey
    aspects:
      - orreryPageModuleProperties
  - name: orreryPageTemplate
    doc: A template for a Orrery page.
    category: core
    keyAspect: orreryPageTemplateKey
    aspects:
      - orreryPageTemplateProperties