config:
  # Probe / isolation: first comment "bot" → AgentClass robot without collapsing AgentName.
  # A first comment of "robot" (or "bot") triggers YAUAA built-ins at conf≥10001 that set
  # AgentName=Robot/BOT and DeviceClass=Robot; override those with higher confidence and keep
  # AgentName from comments.(2).
  - matcher:
      require:
        - 'agent.product.name="Orrery-Client"'
        - 'agent.(1)product.(1)comments.(1)entry="bot"'
      extract:
        - 'DeviceClass : 600000:"Desktop"'
        - 'AgentClass : 600000:"robot"'
        - 'AgentName : 600000 :agent.(1)product.(1)comments.(2)entry'
  - matcher:
      require:
        - 'agent.product.name="Orrery-Client"'
      extract:
        # Prefer Desktop over Robot so AgentName comes from comments.(2).
        # The Python client appends the requests library's own agent
        # ("... python-requests/2.32.3"), which YAUAA classifies as Robot at confidence
        # 400011; stay above it so the mode in comments.(1) wins.
        - 'DeviceClass : 500000:"Desktop"'
        - 'AgentClass : 500000 :agent.(1)product.(1)comments.(1)entry'
        - 'AgentName : 500000 :agent.(1)product.(1)comments.(2)entry'
  - test:
      input:
        user_agent_string: 'Orrery-Client/1.0.0 (sdk; orrery; 1.0.1)'
      expected:
        DeviceClass: 'Desktop'
        AgentClass: 'sdk'
        AgentName: 'orrery'
  - test:
      input:
        user_agent_string: 'Orrery-Client/1.0.0 (cli; orrery; 1.0.1)'
      expected:
        DeviceClass: 'Desktop'
        AgentClass: 'cli'
        AgentName: 'orrery'
  - test:
      input:
        user_agent_string: 'Orrery-Client/1.0.0 (ingestion; orrery; 1.0.1)'
      expected:
        DeviceClass: 'Desktop'
        AgentClass: 'ingestion'
        AgentName: 'orrery'
  - test:
      input:
        user_agent_string: 'Orrery-Client/1.0 (cli; orrery/claude-code; 1.0.1)'
      expected:
        DeviceClass: 'Desktop'
        AgentClass: 'cli'
        AgentName: 'orrery/claude-code'
  - test:
      input:
        user_agent_string: 'Orrery-Client/1.0 (sdk; orrery/unknown; 1.0.1) python-requests/2.32.3'
      expected:
        DeviceClass: 'Desktop'
        AgentClass: 'sdk'
        AgentName: 'orrery/unknown'
  - test:
      input:
        user_agent_string: 'Orrery-Client/1.0 (ingestion; airflow-plugin/github-actions; 1.0.1)'
      expected:
        DeviceClass: 'Desktop'
        AgentClass: 'ingestion'
        AgentName: 'airflow-plugin/github-actions'
