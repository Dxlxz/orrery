# Override to use MariaDB as a backing store for orrery-gms.
---
services:
  mariadb:
    hostname: mariadb
    image: mariadb:10.5
    env_file: env/docker.env
    ports:
      - '3306:3306'

  orrery-gms:
    env_file: ../orrery-gms/env/dev.mariadb.env
    depends_on:
      - mariadb

networks:
  default:
    name: orrery_network
