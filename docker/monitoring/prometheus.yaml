scrape_configs:
  - job_name: 'jmx'
    scrape_interval: 10s
    static_configs:
      - targets:
        - 'host.docker.internal:4318'
        - 'orrery-gms:4318'
        - 'orrery-mae-consumer:4318'
        - 'orrery-mce-consumer:4318'
        - 'orrery-frontend-react:4318'
  - job_name: 'micrometer'
    scrape_interval: 10s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
        - 'orrery-gms:4319'
        - 'orrery-mae-consumer:4319'
        - 'orrery-mce-consumer:4319'
        - 'orrery-frontend-react:4319'