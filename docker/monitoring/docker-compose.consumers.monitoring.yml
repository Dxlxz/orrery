---
services:
  orrery-mae-consumer:
    environment:
      - ENABLE_PROMETHEUS=true
      - ENABLE_OTEL=true
      - OTEL_TRACES_EXPORTER=jaeger
      - OTEL_EXPORTER_JAEGER_ENDPOINT=http://jaeger-all-in-one:14250
      - OTEL_METRICS_EXPORTER=none
      - OTEL_SERVICE_NAME=orrery-mae-consumer
    ports:
      - "4318"
    expose:
      - 4319

  orrery-mce-consumer:
    environment:
      - ENABLE_PROMETHEUS=true
      - ENABLE_OTEL=true
      - OTEL_TRACES_EXPORTER=jaeger
      - OTEL_EXPORTER_JAEGER_ENDPOINT=http://jaeger-all-in-one:14250
      - OTEL_METRICS_EXPORTER=none
      - OTEL_SERVICE_NAME=orrery-mce-consumer
    ports:
      - "4318"
    expose:
      - 4319
