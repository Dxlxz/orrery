# Override to use MySQL as a backing store for orrery-gms.
---
services:
  mysql:
    hostname: mysql
    image: mysql:${ORRERY_MYSQL_VERSION:-8.2}
    env_file: env/docker.env
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_bin
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql

  orrery-gms:
    env_file: ../orrery-gms/env/docker.env
    depends_on:
      - mysql

volumes:
  mysqldata:
