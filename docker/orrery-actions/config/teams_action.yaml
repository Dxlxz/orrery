name: ${ORRERY_ACTIONS_TEAMS_CONSUMER_GROUP_ID:-orrery_teams_action}
enabled: ${ORRERY_ACTIONS_TEAMS_ENABLED:-false}
source:
  type: "kafka"
  config:
    connection:
      bootstrap: ${KAFKA_BOOTSTRAP_SERVER:-localhost:9092}
      schema_registry_url: ${SCHEMA_REGISTRY_URL:-http://localhost:8081}
    topic_routes:
      mcl: ${METADATA_CHANGE_LOG_VERSIONED_TOPIC_NAME:-MetadataChangeLog_Versioned_v1}
      pe: ${PLATFORM_EVENT_TOPIC_NAME:-PlatformEvent_v1}
    # MCL events are entirely skipped before avrogen deserialization because the
    # filter only passes EntityChangeEvent_v1 — aligning with the action's own guard.
    enable_mcl_pre_deserialization_filter: true
filters:
  - type: event_type
    config:
      filter:
        EntityChangeEvent_v1: {}
action:
  type: teams
  config:
    # Action-specific configs (map)
    base_url: ${ORRERY_ACTIONS_TEAMS_ORRERY_BASE_URL:-http://localhost:9002}
    webhook_url: ${ORRERY_ACTIONS_TEAMS_WEBHOOK_URL}
    suppress_system_activity: ${ORRERY_ACTIONS_TEAMS_SUPPRESS_SYSTEM_ACTIVITY:-true}

orrery:
  server: "http://${ORRERY_GMS_HOST:-localhost}:${ORRERY_GMS_PORT:-8080}"
  extra_headers:
    Authorization: "Basic ${ORRERY_SYSTEM_CLIENT_ID:-__orrery_system}:${ORRERY_SYSTEM_CLIENT_SECRET:-JohnSnowKnowsNothing}"
