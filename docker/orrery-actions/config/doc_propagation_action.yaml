name: ${ORRERY_ACTIONS_DOC_PROPAGATION_CONSUMER_GROUP_ID:-orrery_doc_propagation_action}
enabled: ${ORRERY_ACTIONS_DOC_PROPAGATION_ENABLED:-true}
source:
  type: "kafka"
  config:
    connection:
      bootstrap: ${KAFKA_BOOTSTRAP_SERVER:-localhost:9092}
      schema_registry_url: ${SCHEMA_REGISTRY_URL:-http://localhost:8081}
      consumer_config:
        max.poll.interval.ms: ${MAX_POLL_INTERVAL_MS:-60000} # 1 minute per poll
    topic_routes:
      mcl: ${METADATA_CHANGE_LOG_VERSIONED_TOPIC_NAME:-MetadataChangeLog_Versioned_v1}
      pe: ${PLATFORM_EVENT_TOPIC_NAME:-PlatformEvent_v1}
    enable_mcl_pre_deserialization_filter: true
filters:
  - type: event_type
    config:
      filter:
        MetadataChangeLogEvent_v1:
          event:
            - entityType: "schemaField"
              aspectName: "documentation"
        EntityChangeEvent_v1:
          event:
            - category: "DOCUMENTATION"
              entityType: "schemaField"
action:
  type: doc_propagation
  config:
    # Action-specific configs (map)
    columns_enabled: ${ORRERY_ACTIONS_DOC_PROPAGATION_COLUMNS_ENABLED:-true}
    max_propagation_depth: ${ORRERY_ACTIONS_DOC_PROPAGATION_MAX_PROPAGATION_DEPTH:-5}
    max_propagation_fanout: ${ORRERY_ACTIONS_DOC_PROPAGATION_MAX_PROPAGATION_FANOUT:-1000}
    max_propagation_time_millis: ${ORRERY_ACTIONS_DOC_PROPAGATION_MAX_PROPAGATION_TIME_MILLIS:-3600000} # 1 hour
    rate_limit_propagated_writes: ${ORRERY_ACTIONS_DOC_PROPAGATION_RATE_LIMIT_PROPAGATED_WRITES:-1500} # 100 writes per second (default)
    rate_limit_propagated_writes_period: ${ORRERY_ACTIONS_DOC_PROPAGATION_RATE_LIMIT_PROPAGATED_WRITES_PERIOD:-15} # Every 15 seconds

orrery:
  server: "http://${ORRERY_GMS_HOST:-localhost}:${ORRERY_GMS_PORT:-8080}"
  extra_headers:
    Authorization: "Basic ${ORRERY_SYSTEM_CLIENT_ID:-__orrery_system}:${ORRERY_SYSTEM_CLIENT_SECRET:-JohnSnowKnowsNothing}"
