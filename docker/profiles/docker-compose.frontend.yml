
x-orrery-frontend-service: &orrery-frontend-service
  hostname: orrery-frontend-react
  image: ${ORRERY_FRONTEND_IMAGE:-${ORRERY_REPO:-dxlxz}/orrery-frontend-react}:${ORRERY_FRONTEND_VERSION:-${ORRERY_VERSION:-quickstart}}
  ports:
    - ${ORRERY_MAPPED_FRONTEND_PORT:-9002}:9002
  expose:
    - 4319
  env_file:
    - orrery-frontend/env/docker.env
    - ${ORRERY_LOCAL_COMMON_ENV:-empty.env}
    - ${ORRERY_LOCAL_FRONTEND_ENV:-empty2.env}
  environment: &orrery-frontend-service-env
    KAFKA_BOOTSTRAP_SERVER: broker:29092
    ORRERY_GMS_HOST: ${ORRERY_GMS_HOST:-orrery-gms}
    ORRERY_SYSTEM_CLIENT_SECRET: ${ORRERY_SYSTEM_CLIENT_SECRET:-JohnSnowKnowsNothing}
    # Play 3 maps this to play.http.secret.key; HS256 requires >=256 bits (see ApplicationSecret).
    # Overrides env_file when unset on host; use a long random value in production.
    ORRERY_SECRET: ${ORRERY_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    THEME_V2_DEFAULT: ${THEME_V2_DEFAULT:-true}
    PLAY_HTTP_CONTEXT: ${ORRERY_BASE_PATH:-/}
    ORRERY_BASE_PATH: ${ORRERY_BASE_PATH:-/}
    ORRERY_GMS_BASE_PATH: ${ORRERY_GMS_BASE_PATH:-/}
    LOG_AGGREGATOR_ENDPOINT: ${LOG_AGGREGATOR_ENDPOINT:-}
  volumes:
    - ${HOME}/.orrery/plugins:/etc/orrery/plugins

x-orrery-frontend-service-dev: &orrery-frontend-service-dev
  <<: *orrery-frontend-service
  image: ${ORRERY_FRONTEND_IMAGE:-${ORRERY_REPO:-dxlxz}/orrery-frontend-react}:${ORRERY_FRONTEND_VERSION:-${ORRERY_VERSION:-debug}}
  ports:
    - ${ORRERY_MAPPED_FRONTEND_DEBUG_PORT:-5002}:5002
    - ${ORRERY_MAPPED_FRONTEND_PORT:-9002}:9002
  environment:
    <<: *orrery-frontend-service-env
    JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5002
    ORRERY_ANALYTICS_ENABLED: ${ORRERY_ANALYTICS_ENABLED:-true}
  volumes:
    - ../../orrery-frontend/build/stage/main:/orrery-frontend
    # Removed nested mount - causes virtiofs mountpoint error in Docker Desktop >= 4.42.0
    # The file is already in the Docker image, so this mount isn't needed.
    # If you need to override it for development, copy it to the build directory instead.
    # - ./monitoring/client-prometheus-config.yaml:/orrery-frontend/client-prometheus-config.yaml

services:
  frontend-quickstart:
    <<: *orrery-frontend-service
    profiles:
      - quickstart
      - quickstart-frontend
      - quickstart-opensearch2
    depends_on:
      system-update-quickstart:
        condition: service_completed_successfully
  frontend-quickstart-opensearch3:
    <<: *orrery-frontend-service
    profiles:
      - quickstart-opensearch3
