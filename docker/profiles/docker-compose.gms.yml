services:
  #################################
  # System Update (runs SqlSetup when ORRERY_SQL_SETUP_ENABLED=true, then SystemUpdate incl. BuildIndices)
  #################################
  system-update-quickstart:
    <<: *orrery-system-update-service
    profiles:
      - quickstart
      - quickstart-storage
      - quickstart-consumers
      - quickstart-frontend
      - quickstart-backend
      - quickstart-opensearch2
    environment:
      <<: *orrery-system-update-env
      ORRERY_SQL_SETUP_ENABLED: 'true'
    depends_on:
      mysql:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      kafka-broker:
        condition: service_healthy
  system-update-quickstart-cdc:
    <<: *orrery-system-update-service
    profiles:
      - quickstart-consumers-cdc
    environment:
      <<: *orrery-system-update-env
      CDC_MCL_PROCESSING_ENABLED: true
      CDC_CONFIGURE_SOURCE: true
      CDC_USER: ${CDC_USER:-orrery_cdc}
      CDC_PASSWORD: ${CDC_PASSWORD:-orrery_cdc}
      ORRERY_DB_NAME: ${ORRERY_DB_NAME:-orrery}
      DEBEZIUM_PLUGIN_NAME: pgoutput
    depends_on:
      mysql:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      kafka-connect:
        condition: service_started
  system-update-quickstart-cassandra:
    <<: *orrery-system-update-service
    profiles:
      - quickstart-cassandra
    environment:
      <<: [*primary-datastore-cassandra-env, *graph-datastore-neo4j-env, *orrery-system-update-env]
    depends_on:
      neo4j:
        condition: service_healthy
      cassandra-setup:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
  system-update-quickstart-postgres:
    <<: *orrery-system-update-service
    profiles:
      - quickstart-postgres
    environment:
      <<: [*primary-datastore-postgres-env, *orrery-system-update-env]
      ORRERY_MESSAGING_TRANSPORT: ${ORRERY_MESSAGING_TRANSPORT:-pgqueue}
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
  system-update-quickstart-postgres-consumers:
    <<: *orrery-system-update-service
    profiles:
      - quickstart-postgres-consumers
    environment:
