#################################
# Common Environment Variables
#################################
x-primary-datastore-mysql-env: &primary-datastore-mysql-env
  EBEAN_DATASOURCE_USERNAME: ${ORRERY_EBEAN_DATASOURCE_ROOT_USERNAME:-root}
  EBEAN_DATASOURCE_PASSWORD: ${ORRERY_EBEAN_DATASOURCE_ROOT_PASSWORD:-orrery}
  EBEAN_DATASOURCE_HOST: mysql:3306
  EBEAN_DATASOURCE_URL: 'jdbc:mysql://mysql:3306/orrery?verifyServerCertificate=false&useSSL=true&useUnicode=yes&characterEncoding=UTF-8&rewriteBatchedStatements=true&enabledTLSProtocols=TLSv1.2'
  EBEAN_DATASOURCE_DRIVER: com.mysql.jdbc.Driver

x-primary-datastore-postgres-env: &primary-datastore-postgres-env
  EBEAN_DATASOURCE_USERNAME: ${ORRERY_EBEAN_DATASOURCE_ROOT_USERNAME:-orrery}
  EBEAN_DATASOURCE_PASSWORD: ${ORRERY_EBEAN_DATASOURCE_ROOT_PASSWORD:-orrery}
  EBEAN_DATASOURCE_HOST: postgres:5432
  EBEAN_DATASOURCE_URL: 'jdbc:postgresql://postgres:5432/orrery'
  EBEAN_DATASOURCE_DRIVER: org.postgresql.Driver
  EBEAN_POSTGRES_USE_AWS_IAM_AUTH: ${EBEAN_POSTGRES_USE_AWS_IAM_AUTH:-false}
  ORRERY_PGQUEUE_ENABLED: ${ORRERY_PGQUEUE_ENABLED:-true}
  ORRERY_PGQUEUE_MAINTENANCE_CRON_ENABLED: ${ORRERY_PGQUEUE_MAINTENANCE_CRON_ENABLED:-true}

x-primary-datastore-cassandra-env: &primary-datastore-cassandra-env
  CASSANDRA_DATASOURCE_USERNAME: cassandra
  CASSANDRA_DATASOURCE_PASSWORD: cassandra
  CASSANDRA_HOSTS: cassandra
  CASSANDRA_PORT: 9042
  CASSANDRA_DATASOURCE_HOST: 'cassandra:9042'
  ENTITY_SERVICE_IMPL: cassandra

x-graph-datastore-neo4j-env: &graph-datastore-neo4j-env
  GRAPH_SERVICE_IMPL: neo4j
  NEO4J_HOST: 'http://neo4j:7474'
  NEO4J_URI: 'bolt://neo4j'
  NEO4J_USERNAME: neo4j
  NEO4J_PASSWORD: orrery
x-graph-datastore-search-env: &graph-datastore-search-env
  GRAPH_SERVICE_IMPL: elasticsearch

x-search-datastore-opensearch-env: &search-datastore-env
  ELASTICSEARCH_HOST: search
  ELASTICSEARCH_PORT: 9200
  ELASTICSEARCH_PROTOCOL: http
  ELASTICSEARCH_USE_SSL: ${ELASTICSEARCH_USE_SSL:-false}
  ELASTICSEARCH_IMPLEMENTATION: opensearch

x-kafka-env: &kafka-env
  KAFKA_BOOTSTRAP_SERVER: broker:29092
  # KAFKA_SCHEMAREGISTRY_URL=http://schema-registry:8081
  SCHEMA_REGISTRY_TYPE: INTERNAL
  KAFKA_SCHEMAREGISTRY_URL: http://orrery-gms:8080${ORRERY_GMS_BASE_PATH:-}/schema-registry/api/

x-orrery-quickstart-telemetry-env: &orrery-quickstart-telemetry-env
  ORRERY_SERVER_TYPE: ${ORRERY_SERVER_TYPE:-quickstart}
  ORRERY_TELEMETRY_ENABLED: ${ORRERY_TELEMETRY_ENABLED:-true}
  # OSS usage aggregation + Micrometer flush export
  USAGE_AGGREGATION_ENABLED: ${USAGE_AGGREGATION_ENABLED:-true}
  # Faster local flushes so Prometheus smoke waits stay under typical budgets
  USAGE_AGGREGATION_FLUSH_INTERVAL_SECONDS: ${USAGE_AGGREGATION_FLUSH_INTERVAL_SECONDS:-30}
  # Align flush windows to the top of the UTC hour (local parity with production cadence)
  USAGE_AGGREGATION_ALIGNMENT_PERIOD_SECONDS: ${USAGE_AGGREGATION_ALIGNMENT_PERIOD_SECONDS:-3600}
  # Locally include agent_name so usage smoke probes isolate additive cells per probe.
  USAGE_AGGREGATION_INCLUDE_AGENT_NAME: ${USAGE_AGGREGATION_INCLUDE_AGENT_NAME:-true}

x-orrery-dev-telemetry-env: &orrery-dev-telemetry-env
  ORRERY_SERVER_TYPE: ${ORRERY_SERVER_TYPE:-dev}
  ORRERY_TELEMETRY_ENABLED: ${ORRERY_TELEMETRY_ENABLED:-true}
  # OSS usage aggregation + Micrometer flush export
  USAGE_AGGREGATION_ENABLED: ${USAGE_AGGREGATION_ENABLED:-true}
  # Faster local flushes so Prometheus smoke waits stay under typical budgets
  USAGE_AGGREGATION_FLUSH_INTERVAL_SECONDS: ${USAGE_AGGREGATION_FLUSH_INTERVAL_SECONDS:-30}
  # Align flush windows to the top of the UTC hour (local parity with production cadence)
  USAGE_AGGREGATION_ALIGNMENT_PERIOD_SECONDS: ${USAGE_AGGREGATION_ALIGNMENT_PERIOD_SECONDS:-3600}
  # Locally include agent_name so usage smoke probes isolate additive cells per probe.
  USAGE_AGGREGATION_INCLUDE_AGENT_NAME: ${USAGE_AGGREGATION_INCLUDE_AGENT_NAME:-true}

x-orrery-dev-aws-env: &orrery-dev-aws-env
  AWS_PROFILE:
  AWS_SDK_LOAD_CONFIG: ${AWS_SDK_LOAD_CONFIG:-1}

x-localstack-env: &localstack-env
  AWS_ENDPOINT_URL: ${ORRERY_AWS_ENDPOINT_URL:-http://localstack:4566}
  AWS_ACCESS_KEY_ID: ${ORRERY_AWS_ACCESS_KEY_ID:-test}
  AWS_SECRET_ACCESS_KEY: ${ORRERY_AWS_ACCESS_KEY_ID:-test}
  AWS_REGION: ${ORRERY_AWS_REGION:-us-east-1}
  ORRERY_EXECUTOR_ROLE_ARN: ${ORRERY_EXECUTOR_ROLE_ARN:-arn:aws:iam::000000000000:role/test-role}

x-orrery-common: &orrery-common-env
