  ORRERY_TOKEN_SERVICE_SIGNING_KEY: ${ORRERY_TOKEN_SERVICE_SIGNING_KEY}
  ORRERY_TOKEN_SERVICE_SALT: ${ORRERY_TOKEN_SERVICE_SALT}
#################################
# System Update
#################################
x-orrery-system-update-service: &orrery-system-update-service
  hostname: orrery-system-update
  image: ${ORRERY_UPGRADE_IMAGE:-${ORRERY_REPO:-dxlxz}/orrery-upgrade}:${ORRERY_UPDATE_VERSION:-${ORRERY_VERSION:-quickstart}}
  command:
    - -u
    - SystemUpdate
  env_file:
    - orrery-upgrade/env/docker.env
    - ${ORRERY_LOCAL_COMMON_ENV:-empty.env}
    - ${ORRERY_LOCAL_SYS_UPDATE_ENV:-empty2.env}
  environment: &orrery-system-update-env
    <<: [*primary-datastore-mysql-env, *graph-datastore-search-env, *search-datastore-env, *kafka-env, *orrery-common-env, *orrery-authentication-env]

    CREATE_USER: ${ORRERY_CREATE_USER:-false}
    CREATE_USER_USERNAME: ${ORRERY_CREATE_USER_USERNAME:-orrery}
    CREATE_USER_PASSWORD: ${ORRERY_CREATE_USER_PASSWORD:-orrery}
    SCHEMA_REGISTRY_SYSTEM_UPDATE: ${SCHEMA_REGISTRY_SYSTEM_UPDATE:-true}
    SPRING_KAFKA_PROPERTIES_AUTO_REGISTER_SCHEMAS: ${SPRING_KAFKA_PROPERTIES_AUTO_REGISTER_SCHEMAS:-true}
    SPRING_KAFKA_PROPERTIES_USE_LATEST_VERSION: ${SPRING_KAFKA_PROPERTIES_USE_LATEST_VERSION:-true}
    ENTITY_VERSIONING_ENABLED: ${ENTITY_VERSIONING_ENABLED:-true}
    ELASTICSEARCH_INDEX_BUILDER_REFRESH_INTERVAL_SECONDS: ${ELASTICSEARCH_INDEX_BUILDER_REFRESH_INTERVAL_SECONDS:-3}
    # Quickstart and CI keep timeseries and usage at 3s; the product default inside the image is 60s.
    ELASTICSEARCH_INDEX_REFRESH_INTERVAL_TIMESERIES_SECONDS: ${ELASTICSEARCH_INDEX_REFRESH_INTERVAL_TIMESERIES_SECONDS:-3}
    ELASTICSEARCH_INDEX_REFRESH_INTERVAL_USAGE_SECONDS: ${ELASTICSEARCH_INDEX_REFRESH_INTERVAL_USAGE_SECONDS:-3}
    ORRERY_PRECREATE_TOPICS: ${ORRERY_PRECREATE_TOPICS:-true}
    KAFKA_BOOTSTRAP_SERVER: broker:29092
    USE_CONFLUENT_SCHEMA_REGISTRY: false
    ORRERY_SQL_SETUP_ENABLED: ${ORRERY_SQL_SETUP_ENABLED:-true}
    # Same value GMS gets below (orrery-gms-env) — the VIEW_ALL_QUERIES backfill migration this
    # container runs (BackfillViewAllQueriesPrivilegeStep) needs to know whether view authorization
    # is enabled to restrict itself to system policies.
    VIEW_AUTHORIZATION_ENABLED: ${VIEW_AUTHORIZATION_ENABLED:-false}
    # Optional log shipping to a Loki-push-compatible aggregator (dormant when empty)
    LOG_AGGREGATOR_ENDPOINT: ${LOG_AGGREGATOR_ENDPOINT:-}
    PARTITIONS: ${ORRERY_PARTITIONS:-3}
    
  volumes:
    - ${HOME}/.orrery/plugins:/etc/orrery/plugins
  labels:
    orrery_setup_job: true

x-orrery-system-update-service-dev: &orrery-system-update-service-dev
  <<: *orrery-system-update-service
  image: ${ORRERY_UPGRADE_IMAGE:-${ORRERY_REPO:-dxlxz}/orrery-upgrade}:${ORRERY_UPDATE_VERSION:-${ORRERY_VERSION:-debug}}
  ports:
    - ${ORRERY_MAPPED_UPGRADE_DEBUG_PORT:-5003}:5003
  environment: &orrery-system-update-dev-env
    <<: [*orrery-dev-telemetry-env, *orrery-system-update-env, *orrery-dev-aws-env]
    REPROCESS_DEFAULT_BROWSE_PATHS_V2: ${REPROCESS_DEFAULT_BROWSE_PATHS_V2:-false}
    JAVA_TOOL_OPTIONS: '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5003'
    ENTITY_VERSIONING_ENABLED: ${ENTITY_VERSIONING_ENABLED:-true}
  volumes:
    - ../../orrery-upgrade/build/libs/:/orrery/orrery-upgrade/bin/
    - ../../metadata-models/src/main/resources/:/orrery/orrery-gms/resources
    - ${HOME}/.orrery/plugins:/etc/orrery/plugins
    - ${HOME}/.aws:/home/orrery/.aws:ro
    - ${HOME}/.aws/sso/cache:/home/orrery/.aws/sso/cache:rw

#################################
# GMS
#################################
x-orrery-gms-service: &orrery-gms-service
  hostname: orrery-gms
  image: ${ORRERY_GMS_IMAGE:-${ORRERY_REPO:-dxlxz}/orrery-gms}:${ORRERY_GMS_VERSION:-${ORRERY_VERSION:-quickstart}}
  ports:
    - ${ORRERY_MAPPED_GMS_PORT:-8080}:8080
    - ${ORRERY_MAPPED_GMS_MANAGEMENT_PORT:-4319}:4319
  expose:
    - 4319
  env_file:
    - orrery-gms/env/docker.env
    - ${ORRERY_LOCAL_COMMON_ENV:-empty.env}
    - ${ORRERY_LOCAL_GMS_ENV:-empty2.env}
  environment: &orrery-gms-env
    <<: [*primary-datastore-mysql-env, *graph-datastore-search-env, *search-datastore-env, *orrery-quickstart-telemetry-env, *kafka-env, *orrery-common-env, *orrery-authentication-env]
    ALTERNATE_MCP_VALIDATION: ${ALTERNATE_MCP_VALIDATION:-true}
    STRICT_URN_VALIDATION_ENABLED: ${STRICT_URN_VALIDATION_ENABLED:-true}
    ENTITY_VERSIONING_ENABLED: ${ENTITY_VERSIONING_ENABLED:-true}
    THEME_V2_DEFAULT: ${THEME_V2_DEFAULT:-true}
    METADATA_SERVICE_AUTH_ENABLED: ${METADATA_SERVICE_AUTH_ENABLED:-true}
    SHOW_HAS_SIBLINGS_FILTER: ${SHOW_HAS_SIBLINGS_FILTER:-true}
    SHOW_SEARCH_BAR_AUTOCOMPLETE_REDESIGN: ${SHOW_SEARCH_BAR_AUTOCOMPLETE_REDESIGN:-true}
    SEARCH_BAR_API_VARIANT: ${SEARCH_BAR_API_VARIANT:-SEARCH_ACROSS_ENTITIES}
    POLICY_CACHE_REFRESH_INTERVAL_SECONDS: ${POLICY_CACHE_REFRESH_INTERVAL_SECONDS:-120}
    ORRERY_OBJECT_STORAGE_URI: ${ORRERY_OBJECT_STORAGE_URI:-file:///tmp/orrery-object-storage}
    SHOW_HOME_PAGE_REDESIGN: ${SHOW_HOME_PAGE_REDESIGN:-true}
    MCL_CONSUMER_BATCH_ENABLED: ${MCL_CONSUMER_BATCH_ENABLED:-true}
    MCP_CONSUMER_BATCH_ENABLED: ${MCP_CONSUMER_BATCH_ENABLED:-true}
    DEV_TOOLING_ENABLED: ${DEV_TOOLING_ENABLED:-false}
    VIEW_AUTHORIZATION_ENABLED: ${VIEW_AUTHORIZATION_ENABLED:-false}
    # Same values as system-update, which writes them onto the index. Unset, these stay at 3s
    # instead of the image default of 60s.
    ELASTICSEARCH_INDEX_REFRESH_INTERVAL_TIMESERIES_SECONDS: ${ELASTICSEARCH_INDEX_REFRESH_INTERVAL_TIMESERIES_SECONDS:-3}
    ELASTICSEARCH_INDEX_REFRESH_INTERVAL_USAGE_SECONDS: ${ELASTICSEARCH_INDEX_REFRESH_INTERVAL_USAGE_SECONDS:-3}
    # Optional log shipping to a Loki-push-compatible aggregator (dormant when empty)
    LOG_AGGREGATOR_ENDPOINT: ${LOG_AGGREGATOR_ENDPOINT:-}
  healthcheck:
    test: curl -sS --fail http://orrery-gms:${ORRERY_GMS_PORT:-8080}/health
    start_period: 90s
    interval: 1s
    retries: 3
    timeout: 5s
  volumes:
    - ${HOME}/.orrery/plugins:/etc/orrery/plugins
    - ${HOME}/.orrery/search:/etc/orrery/search
  labels:
    io.orreryproject.orrery.component: "gms"

x-orrery-gms-service-dev: &orrery-gms-service-dev
  <<: *orrery-gms-service
  image: ${ORRERY_GMS_IMAGE:-${ORRERY_REPO:-dxlxz}/orrery-gms}:${ORRERY_GMS_VERSION:-${ORRERY_VERSION:-debug}}
  ports:
    - ${ORRERY_MAPPED_GMS_DEBUG_PORT:-5001}:5001
    - ${ORRERY_MAPPED_GMS_PORT:-8080}:8080
    - ${ORRERY_MAPPED_GMS_MANAGEMENT_PORT:-4319}:4319
  env_file:
    - orrery-gms/env/docker.env
    - ${ORRERY_LOCAL_COMMON_ENV:-empty.env}
    - ${ORRERY_LOCAL_GMS_ENV:-empty2.env}
  environment: &orrery-gms-dev-env
    <<: [*orrery-dev-telemetry-env, *orrery-gms-env, *orrery-dev-aws-env]
    JAVA_TOOL_OPTIONS: '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5001 -Dlogging.appender.debug_file.level=${GMS_LOGGING_APPENDER_DEBUG_FILE_LEVEL:-DEBUG}'
    SEARCH_SERVICE_ENABLE_CACHE: false
    LINEAGE_SEARCH_CACHE_ENABLED: false
    SHOW_BROWSE_V2: true
    ENTITY_VERSIONING_ENABLED: ${ENTITY_VERSIONING_ENABLED:-true}
    METADATA_SERVICE_AUTH_ENABLED: ${METADATA_SERVICE_AUTH_ENABLED:-true}
    DEV_TOOLING_ENABLED: ${DEV_TOOLING_ENABLED:-false}
    ORRERY_VALIDATION_ASPECT_SIZE_PRE_PATCH_ENABLED: ${ORRERY_VALIDATION_ASPECT_SIZE_PRE_PATCH_ENABLED:-true}
    ORRERY_VALIDATION_ASPECT_SIZE_PRE_PATCH_WARN_SIZE_BYTES: ${ORRERY_VALIDATION_ASPECT_SIZE_PRE_PATCH_WARN_SIZE_BYTES:-1048576}
    ORRERY_VALIDATION_ASPECT_SIZE_PRE_PATCH_MAX_SIZE_BYTES: ${ORRERY_VALIDATION_ASPECT_SIZE_PRE_PATCH_MAX_SIZE_BYTES:-1572864}
    ORRERY_VALIDATION_ASPECT_SIZE_PRE_PATCH_OVERSIZED_REMEDIATION: ${ORRERY_VALIDATION_ASPECT_SIZE_PRE_PATCH_OVERSIZED_REMEDIATION:-IGNORE}
    ORRERY_VALIDATION_ASPECT_SIZE_POST_PATCH_ENABLED: ${ORRERY_VALIDATION_ASPECT_SIZE_POST_PATCH_ENABLED:-true}
    ORRERY_VALIDATION_ASPECT_SIZE_POST_PATCH_WARN_SIZE_BYTES: ${ORRERY_VALIDATION_ASPECT_SIZE_POST_PATCH_WARN_SIZE_BYTES:-1048576}
    ORRERY_VALIDATION_ASPECT_SIZE_POST_PATCH_MAX_SIZE_BYTES: ${ORRERY_VALIDATION_ASPECT_SIZE_POST_PATCH_MAX_SIZE_BYTES:-1572864}
    ORRERY_VALIDATION_ASPECT_SIZE_POST_PATCH_OVERSIZED_REMEDIATION: ${ORRERY_VALIDATION_ASPECT_SIZE_POST_PATCH_OVERSIZED_REMEDIATION:-IGNORE}
  volumes:
    - ./orrery-gms/start.sh:/orrery/orrery-gms/scripts/start.sh
    - ./monitoring/client-prometheus-config.yaml:/orrery/orrery-gms/scripts/prometheus-config.yaml
    - ../../metadata-models/src/main/resources/:/orrery/orrery-gms/resources
    - ../../metadata-service/war/build/libs/:/orrery/orrery-gms/bin
    - ${HOME}/.orrery/plugins:/etc/orrery/plugins
    - ${HOME}/.orrery/search:/etc/orrery/search
    - ${HOME}/.aws:/home/orrery/.aws:ro
    - ${HOME}/.aws/sso/cache:/home/orrery/.aws/sso/cache:rw


