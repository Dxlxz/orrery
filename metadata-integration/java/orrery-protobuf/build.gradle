plugins {
    id("com.palantir.git-version") apply false
    id "application"
}
apply plugin: 'java'
apply plugin: 'com.gradleup.shadow'
apply plugin: 'signing'
apply plugin: 'io.codearte.nexus-staging'
apply plugin: 'maven-publish'
apply from: '../versioning.gradle'
apply from: '../../../gradle/coverage/java-coverage.gradle'

jar.enabled = false // Since we only want to build shadow jars, disabling the regular jar creation

ext {
   javaMainClass = "orrery.protobuf.Proto2Orrery"
}

application {
    mainClass = javaMainClass
}

dependencies {
    implementation project(':metadata-models')
    implementation project(path: ':metadata-integration:java:orrery-client', configuration: 'shadow')

    implementation externalDependency.guava
    implementation externalDependency.protobuf
    implementation externalDependency.jgrapht
    implementation externalDependency.gson
    implementation externalDependency.commonsCli
    implementation externalDependency.httpClient
    implementation externalDependency.slf4jApi
    implementation platform(externalDependency.jacksonBom)
    implementation externalDependency.jacksonCore
    compileOnly externalDependency.lombok
    annotationProcessor externalDependency.lombok
    testImplementation externalDependency.testng
}

import java.nio.file.Paths
task compileProtobuf {
    doLast {
        def basePath = Paths.get("${projectDir}/src/test/resources")
        [
                fileTree("${projectDir}/src/test/resources/protobuf") { include "*.proto" },
                fileTree("${projectDir}/src/test/resources/extended_protobuf") { include "*.proto" }
        ].collectMany { it.collect() }.each { f ->
            def input = basePath.relativize(Paths.get(f.getAbsolutePath()))
            println(input.toString() + " => " + input.toString().replace(".proto", ".protoc"))
            execOps.exec {
                workingDir "${projectDir}/src/test/resources"
                commandLine 'protoc', '--proto_path=.', '--include_imports', '--include_source_info',
                        "--descriptor_set_out=${input.toString().replace(".proto", ".protoc")}",
                        input
            }
        }
    }
}

task checkShadowJar(type: Exec) {
   commandLine 'sh', '-c', 'scripts/check_jar.sh'
}

//mark implementation dependencies which needs to excluded along with transitive dependencies from shadowjar
//functionality is exactly same as "implementation"
configurations {
    provided
    implementation.extendsFrom provided
}

shadowJar {
  zip64=true
  archiveClassifier = ''
  def exclude_modules = project
            .configurations
            .provided
            .resolvedConfiguration
            .getLenientConfiguration()
            .getAllModuleDependencies()
            .collect {
                it.name
            }
  dependencies {
    exclude {
            exclude_modules.contains(it.name)
        }

  }
  mergeServiceFiles()
  // we relocate namespaces manually, because we want to know exactly which libs we are exposing and why
  // we can move to automatic relocation using ConfigureShadowRelocation after we get to a good place on these first
    relocate 'com.fasterxml.jackson', 'orrery.shaded.jackson'
    relocate 'net.jcip.annotations', 'orrery.shaded.annotations'
    relocate 'javassist', 'orrery.shaded.javassist'
    relocate 'edu.umd.cs.findbugs', 'orrery.shaded.findbugs'
    relocate 'org.antlr', 'orrery.shaded.org.antlr'
    relocate 'antlr', 'orrery.shaded.antlr'
    relocate 'org.apache.commons', 'orrery.shaded.org.apache.commons'
    relocate 'org.apache.http', 'orrery.shaded.org.apache.http'
    relocate 'org.reflections', 'orrery.shaded.org.reflections'
    relocate 'st4hidden', 'orrery.shaded.st4hidden'
    relocate 'org.stringtemplate', 'orrery.shaded.org.stringtemplate'
    relocate 'org.abego.treelayout', 'orrery.shaded.treelayout'
    relocate 'org.slf4j', 'orrery.shaded.slf4j'
    relocate 'com.github.benmanes.caffeine', 'orrery.shaded.com.github.benmanes.caffeine'
    relocate 'org.checkerframework', 'orrery.shaded.org.checkerframework'
    relocate 'org.jspecify', 'orrery.shaded.org.jspecify'
    relocate 'org.jgrapht', 'orrery.shaded.org.jgrapht'
    relocate 'org.jheaps', 'orrery.shaded.org.jheaps'
    relocate 'org.apfloat', 'orrery.shaded.org.apfloat'
    relocate 'ch.randelshofer', 'orrery.shaded.ch.randelshofer'
    relocate 'org.apache.hc', 'orrery.shaded.org.apache.hc'
 
  finalizedBy checkShadowJar
}

checkShadowJar {
   dependsOn shadowJar
}

assemble {
    dependsOn shadowJar
}

task sourcesJar(type: Jar) {
     archiveClassifier = 'sources'
     from sourceSets.main.allSource
}

task javadocJar(type: Jar) {
    archiveClassifier = 'javadoc'
    from javadoc
}


publishing {
  publications {
    shadow(MavenPublication) {
      from components.shadow
      pom {
        name = 'Orrery Protobuf'
        group = 'io.orrery'
        artifactId = 'orrery-protobuf'
        description = 'Orrery integration with Protobuf schemas for metadata'
        url = 'https://docs.orrery.dev'
        artifacts = [ shadowJar, javadocJar, sourcesJar ]

        scm {
          connection = 'scm:git:git://github.com/Dxlxz/orrery.git'
          developerConnection = 'scm:git:ssh://github.com:Dxlxz/orrery.git'
          url = 'https://github.com/Dxlxz/orrery.git'
        }

        licenses {
          license {
            name = 'The Apache License, Version 2.0'
            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
          }
        }

        developers {
          developer {
            id = 'orrery'
            name = 'Orrery'
            email = 'orrery@orrery.dev'
          }
        }
      }
    }
  }

  repositories {
    maven {
      def releasesRepoUrl = "https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/"
      def snapshotsRepoUrl = "https://ossrh-staging-api.central.sonatype.com/content/repositories/snapshots/"
      def ossrhUsername = System.getenv('RELEASE_USERNAME')
      def ossrhPassword = System.getenv('RELEASE_PASSWORD')
      credentials {
        username ossrhUsername
        password ossrhPassword
      }
      url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
    }
  }
}

signing {
    def signingKey = findProperty("signingKey")
    def signingPassword = System.getenv("SIGNING_PASSWORD")
    useInMemoryPgpKeys(signingKey, signingPassword)
    sign publishing.publications.shadow
}

nexusStaging {
    serverUrl = "https://ossrh-staging-api.central.sonatype.com/service/local/" //required only for projects registered in Sonatype after 2021-02-24
    username = System.getenv("RELEASE_USERNAME")
    password = System.getenv("RELEASE_PASSWORD")
}

startScripts.dependsOn shadowJar
